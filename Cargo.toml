[package]
name = "tuisignal"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Client Signal en mode console (TUI)"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
hex = "0.4.3"
image = "0.25.10"
mime_guess = "2.0.5"
presage = { git = "https://github.com/whisperfish/presage", rev = "290effe47721332357ba5ec143e1a3630b07c3fe" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "290effe47721332357ba5ec143e1a3630b07c3fe" }
qr2term = "0.3.3"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
textwrap = "0.16.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.3"

# Requis par presage (voir son Cargo.toml de workspace).
[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# ML-KEM non optimisé peut déborder la pile en déchiffrant les messages PQXDH.
[profile.dev.package.libcrux-ml-kem]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
